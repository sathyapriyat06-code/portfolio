<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="insta-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#833ab4"/>
      <stop offset="50%" stop-color="#fd1d1d"/>
      <stop offset="100%" stop-color="#fcb045"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#0f172a"/>
  
  <!-- Outer Instagram Camera Outline -->
  <rect x="210" y="80" width="180" height="180" rx="40" fill="none" stroke="url(#insta-bg)" stroke-width="12"/>
  <circle cx="300" cy="170" r="45" fill="none" stroke="url(#insta-bg)" stroke-width="12"/>
  <circle cx="345" cy="125" r="10" fill="#fd1d1d"/>

  <!-- Subtitle Text -->
  <text x="300" y="300" fill="#a5b4fc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">React.js Reusable Component Feed</text>

  <!-- Overlay -->
  <rect x="0" y="340" width="600" height="60" fill="rgba(8, 12, 20, 0.9)"/>
  <text x="30" y="375" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Instagram Clone (React.js)</text>
</svg>
