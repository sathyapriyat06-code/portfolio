<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  
  <!-- Blockchain Network Graphic Nodes -->
  <g stroke="rgba(99, 102, 241, 0.4)" stroke-width="2" fill="none">
    <line x1="150" y1="200" x2="300" y2="120" />
    <line x1="300" y1="120" x2="450" y2="200" />
    <line x1="450" y1="200" x2="300" y2="280" />
    <line x1="300" y1="280" x2="150" y2="200" />
    <line x1="150" y1="200" x2="300" y2="200" />
    <line x1="300" y1="200" x2="450" y2="200" />
  </g>

  <!-- Node Blocks -->
  <rect x="110" y="170" width="80" height="60" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
  <text x="150" y="205" fill="#a5b4fc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">IPFS</text>

  <rect x="250" y="90" width="100" height="60" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
  <text x="300" y="125" fill="#67e8f9" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Solidity Smart Contract</text>

  <rect x="410" y="170" width="80" height="60" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="450" y="205" fill="#6ee7b7" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">MetaMask</text>

  <rect x="230" y="250" width="140" height="70" rx="12" fill="url(#accent)"/>
  <text x="300" y="285" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">VERIFIED CERT</text>
  <text x="300" y="305" fill="rgba(255,255,255,0.8)" font-family="monospace" font-size="10" text-anchor="middle">0x8F3...9A12</text>

  <!-- Title Overlay -->
  <rect x="0" y="340" width="600" height="60" fill="rgba(8, 12, 20, 0.9)"/>
  <text x="30" y="375" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Decentralised Certificate Verification System</text>
</svg>
