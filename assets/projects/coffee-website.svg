<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="coffee-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#coffee-bg)"/>
  
  <!-- Coffee Cup Graphic -->
  <path d="M 230,160 Q 230,280 300,280 Q 370,280 370,160 Z" fill="#78350f" stroke="#f59e0b" stroke-width="4"/>
  <rect x="220" y="140" width="160" height="20" rx="6" fill="#b45309"/>
  <!-- Handle -->
  <path d="M 370,170 Q 420,190 370,230" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
  <!-- Steam Curves -->
  <path d="M 270,120 Q 260,90 280,70" fill="none" stroke="rgba(245, 158, 11, 0.6)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 300,120 Q 310,90 290,70" fill="none" stroke="rgba(245, 158, 11, 0.6)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 330,120 Q 320,90 340,70" fill="none" stroke="rgba(245, 158, 11, 0.6)" stroke-width="4" stroke-linecap="round"/>

  <!-- Overlay -->
  <rect x="0" y="340" width="600" height="60" fill="rgba(8, 12, 20, 0.9)"/>
  <text x="30" y="375" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Coffee Website (Python Full Stack)</text>
</svg>
