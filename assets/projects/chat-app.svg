<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="chat-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#chat-bg)"/>
  
  <!-- Chat Window Interface Frame -->
  <rect x="50" y="40" width="500" height="280" rx="16" fill="#1e293b" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  
  <!-- Chat Window Header -->
  <path d="M 50,56 C 50,47 57,40 66,40 L 534,40 C 543,40 550,47 550,56 L 550,80 L 50,80 Z" fill="#0f172a"/>
  <circle cx="80" cy="60" r="6" fill="#ef4444"/>
  <circle cx="98" cy="60" r="6" fill="#f59e0b"/>
  <circle cx="116" cy="60" r="6" fill="#10b981"/>
  <text x="300" y="65" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Real-Time Chat App • Socket.IO Active</text>

  <!-- Chat Messages -->
  <rect x="80" y="100" width="220" height="45" rx="12" fill="#334155"/>
  <text x="95" y="127" fill="#f8fafc" font-family="sans-serif" font-size="13">Hey team! Project ready for review?</text>
  
  <rect x="300" y="160" width="220" height="45" rx="12" fill="#6366f1"/>
  <text x="315" y="187" fill="#ffffff" font-family="sans-serif" font-size="13">Yes! Live socket test connected 🚀</text>

  <rect x="80" y="220" width="180" height="45" rx="12" fill="#334155"/>
  <text x="95" y="247" fill="#34d399" font-family="sans-serif" font-size="13">● Sathyapriya is typing...</text>

  <!-- Footer Label -->
  <rect x="0" y="340" width="600" height="60" fill="rgba(8, 12, 20, 0.9)"/>
  <text x="30" y="375" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Real-Time Chat Application (MERN + Socket.IO)</text>
</svg>
